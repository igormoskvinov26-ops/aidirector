[project]
name = "rubl-ai-director"
version = "1.0.0"
description = "AI Director for Rubl Barbershop"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    "loguru>=0.7.0",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    # Настройки расходов проверяются на настоящей базе, а не на заглушках.
    "aiosqlite>=0.20.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
# B008 — вызов в значении по умолчанию. Для FastAPI это штатная идиома
# (Depends(), Query()), а не ошибка, поэтому правило отключено осознанно.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Без этого `uv run pytest` падает на `No module named 'app'`
# и собирает ноль тестов — ровно это и происходило в сборке 2.0.
pythonpath = ["."]
testpaths = ["tests"]
