services:
  postgres:
    image: postgres:16-alpine
    container_name: rubl_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rubl_director}
      POSTGRES_USER: ${POSTGRES_USER:-rubl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-<REDACTED>}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rubl} -d ${POSTGRES_DB:-rubl_director}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: rubl_backend
    env_file:
      - ../.env
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: rubl_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
